<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Credit Maker</title>
    <script type="module" src="./main.js"></script>
    <script src="./credit/credit.js"></script>
    <script src="./credit/generator.js"></script>
    <script>
      function prepareContributors(contributors) {
        result = []
        activeContributors = contributors.filter((c) => c.name != '')
        activeContributors.forEach((c) => {
          activeRoles = Object.keys(c.role)
            .filter((k) => c.role[k] === true)
            .map((k) => allCreditRoles[k].name)

          result.push({
            name: c.name,
            role: activeRoles,
          })
        })
        return result
      }
    </script>
  </head>
  <body>
    <main
      class="flex min-h-screen flex-col items-center justify-between bg-white p-4"
      x-data="{ output: ''}"
    >
      <div class="w-fullconst z-10 flex flex-row gap-4">
        <!-- Left side -->
        <div
          class="w-1/2 divide-y divide-gray-200 overflow-hidden rounded-md bg-white/70 shadow-sm"
        >
          <div class="flex-wggrap flex items-center justify-between px-4 py-5">
            <!-- Card header -->
            <p class="text-gray-dark text-xl">Contributor information</p>
          </div>
          <div class="p-5">
            <!--  Content goes here  -->
            <form
              id="contributor-form"
              ref="{contributorFormRef}"
              class="space-y-4"
              x-data="{
                contributors: [
                createContributor(),
                createContributor(),
                createContributor(),
                createContributor(),
                createContributor(),
                createContributor(),
                ]
              }"
              @change="
              prepared = prepareContributors(contributors)
              output = toPlainText(prepared)
              "
            >
              <fieldset aria-label="Names of contributors">
                <label
                  for="generator-style"
                  class="block text-sm/6 font-medium text-gray-dark"
                  >Output style</label
                >
                <div class="grid mt-2 w-full grid-cols-1 lg:grow">
                  <select
                    id="generator-style"
                    name="generator style"
                    onChange=""
                    class="text-gray-dark col-start-1 row-start-1 w-full appearance-none rounded-md bg-white py-1.5 pr-8 pl-3 text-base outline-1 -outline-offset-1 outline-gray-300 focus:outline-2 focus:-outline-offset-2 focus:outline-blue-500 sm:text-sm/6"
                  >
                    <option key="plain">Plain text</option>
                    <option key="plainDegree">
                      Plain text with degree options
                    </option>
                    <option key="latexItemize">LaTeX itemize</option>
                    <option key="latexText">LaTeX text</option>
                  </select>
                  <svg
                    viewBox="0 0 16 16"
                    fill="currentColor"
                    data-slot="icon"
                    aria-hidden="true"
                    class="pointer-events-none col-start-1 row-start-1 mr-2 size-5 self-center justify-self-end text-gray-500 sm:size-4 dark:text-gray-400"
                  >
                    <path
                      d="M4.22 6.22a.75.75 0 0 1 1.06 0L8 8.94l2.72-2.72a.75.75 0 1 1 1.06 1.06l-3.25 3.25a.75.75 0 0 1-1.06 0L4.22 7.28a.75.75 0 0 1 0-1.06Z"
                      clip-rule="evenodd"
                      fill-rule="evenodd"
                    />
                  </svg>
                </div>
              </fieldset>
              <fieldset aria-label="Names of contributors">
                <div>
                  <label class="block text-sm/6 font-medium text-gray-dark"
                    >Contributor names</label
                  >
                  <div class="grid grid-cols-1 gap-2 md:grid-cols-2">
                    <template x-for="(contributor, i) in contributors">
                      <div class="mt-2 flex rounded-md shadow-xs">
                        <span
                          class="text-gray-light inline-flex items-center rounded-l-md border border-r-0 border-gray-300 px-3 sm:text-sm"
                          x-text="i + 1"
                        >
                        </span>
                        <input
                          type="text"
                          x-model="contributors[i].name"
                          class="text-gray-dark focus:ring-primary block w-full min-w-0 flex-1 rounded-none rounded-r-md border-0 px-3 py-1.5 ring-1 ring-gray-300 ring-inset placeholder:text-gray-400 focus:ring-2 focus:ring-inset sm:text-sm sm:leading-6"
                        />
                      </div>
                    </template>
                  </div>
                </div>
              </fieldset>

              <fieldset>
                <legend class="sr-only">Credit roles</legend>
                <div class="flex items-start space-x-2">
                  <template x-for="(_, i) in contributors">
                    <p
                      class="v-4 text-gray-light w-4 text-center"
                      x-text="i+1"
                    />
                  </template>
                </div>
                <div class="space-y-3">
                  <template x-for="(role, key) in allCreditRoles">
                    <div class="relative flex items-start">
                      <div class="flex h-6 items-center space-x-2">
                        <template x-for="(_, i) in contributors">
                          <input
                            type="checkbox"
                            x-model="contributors[i].role[key]"
                            aria-describedby="credit attribution per author checkbox"
                            class="text-primary focus:ring-primary h-4 w-4 cursor-pointer items-center rounded-sm border-gray-300"
                          />
                        </template>
                      </div>

                      <div
                        class="ml-3 text-sm leading-6"
                        x-data="{ id: $id('ckb-role') }"
                      >
                        <label
                          :htmlFor="id"
                          class="text-gray-dark font-medium"
                          x-text="role.name"
                        ></label>
                        <p
                          :id="id"
                          class="text-gray-light text-wrap"
                          x-text="role.definition"
                        ></p>
                      </div>
                    </div>
                  </template>
                </div>
              </fieldset>
            </form>
          </div>
        </div>

        <!-- Right side -->
        <div
          class="w-1/2 divide-y divide-gray-200 overflow-hidden rounded-md bg-white/70 shadow-sm"
        >
          <div class="flex flex-wrap items-center justify-between gap-4 p-4">
            Card header

            <!-- </SecondaryButton> -->

          <div class="px-4 py-5">
            <!-- Content goes here -->
            <pre
              class="text-gray-dark font-mono text-xl text-wrap"
              x-text="output"
            ></pre>
          </div>
        </div>
      </div>
